[project]
name = "accord"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.10",
    "fastapi>=0.165.0",
    "google-cloud-storage>=3.17.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 140
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["E501", "S101", "S311", "B008", "S105", "S106", "S603", "S607", "SIM102", "SIM103", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
