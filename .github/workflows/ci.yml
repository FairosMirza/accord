name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accord" --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ACCORD_DATABASE_URL: postgresql+psycopg://accord:accord@localhost:5432/accord_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npm run build

  deploy:
    name: Deploy to Cloud Run
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write # keyless auth to Google Cloud via Workload Identity Federation
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/accord/accord:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: docker build -t "$IMAGE" .
      - run: docker push "$IMAGE"
      - name: Deploy (keeps the service's existing settings and secrets)
        run: |
          gcloud run deploy accord --image "$IMAGE" --region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT_ID }} --quiet
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe accord --region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT_ID }} --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL/api/health"
          curl --fail --silent --show-error "$URL/api/auth/config"
